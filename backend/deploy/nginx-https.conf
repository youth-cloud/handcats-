# This file is included by nginx.conf inside http {} on stock Ubuntu Nginx.
# If another panel/proxy owns ports 80/443, configure that proxy instead.
limit_req_zone $binary_remote_addr zone=handcats_requests:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=handcats_connections:10m;

server {
    listen 443 ssl;
    server_name api.youthd.cn;
    ssl_certificate /etc/letsencrypt/live/api.youthd.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.youthd.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 13m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;
    limit_conn handcats_connections 12;
    limit_conn_status 429;
    limit_req_status 429;
    access_log /var/log/nginx/handcats-access.log combined;
    error_log /var/log/nginx/handcats-error.log warn;
    add_header X-Content-Type-Options nosniff always;

    location / {
        limit_req zone=handcats_requests burst=30 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 100s;
        proxy_send_timeout 30s;
        proxy_request_buffering on;
        proxy_cache off;
        proxy_next_upstream off;
    }
}
